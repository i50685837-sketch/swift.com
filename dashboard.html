<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - SWIFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',system-ui;overflow-x:hidden}

  /* NAVBAR */
 .nav{background:#111827;border-bottom:1px solid #1f2937;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
 .nav-left{display:flex;align-items:center;gap:15px}
 .nav h1{color:#22c55e;font-size:22px}

  /* HAMBURGER */
 .hamburger{display:flex;flex-direction:column;gap:5px;cursor:pointer}
 .hamburger span{width:25px;height:3px;background:#22c55e;border-radius:2px;transition:0.3s}

 .user{display:flex;align-items:center;gap:12px}
 .user img{width:36px;height:36px;border-radius:50%}
 .logout{background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}

  /* SIDEBAR */
 .sidebar{
    position:fixed;top:0;left:-280px;width:280px;height:100%;
    background:#111827;border-right:1px solid #1f2937;
    transition:0.3s;z-index:200;padding-top:70px
  }
 .sidebar.active{left:0}
 .sidebar a{
    display:flex;align-items:center;gap:12px;
    padding:16px 25px;color:#cbd5e1;text-decoration:none;font-size:15px;
    border-left:3px solid transparent;transition:0.2s
  }
 .sidebar a:hover{background:#0a0f1e;border-left:3px solid #22c55e;color:#22c55e}
 .sidebar a svg{width:20px;height:20px;flex-shrink:0}
 .menu-title{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:20px 25px 5px;font-weight:600}

  /* OVERLAY */
 .overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.6);display:none;z-index:150
  }
 .overlay.active{display:block}

 .container{max-width:1200px;margin:0 auto;padding:30px 20px}
 .balance-card{background:linear-gradient(135deg,#22c55e,#16a34a);padding:35px;border-radius:20px;text-align:center;color:#0a0f1e}
 .balance-card h1{font-size:48px;margin:10px 0;font-weight:800}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:30px}
 .card{background:#111827;border:1px solid #1f2937;padding:25px;border-radius:16px}
 .btn{width:100%;padding:14px;background:#22c55e;color:#0a0f1e;border:none;border-radius:10px;font-weight:700;cursor:pointer}
 .chart-card{background:#111827;border:1px solid #1f2937;padding:25px;border-radius:16px;margin-top:30px}
  #loading{text-align:center;padding:100px;font-size:18px}
</style>
</head>
<body>
<div id="loading">Loading your dashboard...</div>

<div id="app" style="display:none">
  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- SIDEBAR MENU -->
  <div class="sidebar" id="sidebar">
    <div class="menu-title">MAIN MENU</div>

    <a href="/dashboard.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
      Dashboard
    </a>

    <a href="/deposits.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"/></svg>
      Deposits
    </a>

    <a href="/investments.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
      My Investments
    </a>

    <a href="/returns.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"/></svg>
      Returns
    </a>

    <div class="menu-title">ACCOUNT</div>

    <a href="/profile.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
      Profile
    </a>

    <a href="/settings.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
      Settings
    </a>

    <a href="/about.html">
      <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
      About
    </a>

    <a href="#" onclick="logout()">
      <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 011-1h10a1 1 0 011 1v10a1 1 0 102 0V4a1 1 0 00-1-1H3zm9 8a1 1 0 00-1-1h-4a1 1 0 100 2h4a1 1 0 001-1z" clip-rule="evenodd"/></svg>
      Logout
    </a>
  </div>

  <!-- NAVBAR -->
  <div class="nav">
    <div class="nav-left">
      <div class="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
      <h1>SWIFT 💰</h1>
    </div>
    <div class="user">
      <img id="user-pic" src="" alt="user">
      <span id="user-name"></span>
    </div>
  </div>

  <div class="container">
    <div class="balance-card">
      <p>Available Balance</p>
      <h1>$<span id="balance">0.00</span></h1>
    </div>

    <div class="chart-card">
      <h2>📊 Your Profit Over Time</h2>
      <canvas id="profitChart"></canvas>
    </div>

    <div class="grid">
      <div class="card"><h3>💳 Deposits</h3><button class="btn" onclick="location='/deposits.html'">Deposit Now</button></div>
      <div class="card"><h3>📈 My Investments</h3><button class="btn" onclick="location='/investments.html'">View Plans</button></div>
      <div class="card"><h3>💰 Returns</h3><button class="btn" onclick="location='/returns.html'">See Earnings</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script>
let auth0;

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
}

async function init() {
  auth0 = await createAuth0Client({
    domain: "dev-423epnlkd231fvw0.us.auth0.com",
    client_id: "DAFUBnFPvwSW9MKDwCyu64Nux9VDIT3r"
  });

  if(!(await auth0.isAuthenticated())) {
    window.location = '/login.html';
    return;
  }

  const user = await auth0.getUser();
  document.getElementById('user-name').innerText = user.name.split(' ')[0];
  document.getElementById('user-pic').src = user.picture;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function logout() {
  auth0.logout({ logoutParams: { returnTo: window.location.origin + '/index.html' } });
}

init();
</script>
</body>
</html>
