<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SWIFT - Invest & Grow</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui;color:#fff;overflow-x:hidden}
  
  /* PEOPLE SUCCESS BACKGROUND */
  .hero{
    height:100vh;
    background: 
      linear-gradient(135deg, rgba(10,15,30,0.90) 0%, rgba(10,15,30,0.75) 100%),
      url('https://images.unsplash.com/photo-1556761175-5973dc0f32e7?q=80&w=1932') center/cover no-repeat;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px
  }
  
  .glass{
    background:rgba(17,24,39,0.65);
    backdrop-filter: blur(16px);
    border:1px solid rgba(34,197,94,0.2);
    padding:50px 40px;
    border-radius:24px;
    max-width:750px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5)
  }
  
  h1{font-size:56px;color:#22c55e;margin:0;font-weight:800;letter-spacing:-1.5px}
  .sub{font-size:20px;color:#e2e8f0;margin:20px 0 35px;max-width:600px;line-height:1.7}
  
  .stats{display:flex;gap:40px;justify-content:center;margin:30px 0;flex-wrap:wrap}
  .stat{text-align:center}
  .stat h2{color:#22c55e;font-size:32px;margin:0;font-weight:700}
  .stat p{font-size:13px;color:#94a3b8;margin:5px 0 0;text-transform:uppercase;letter-spacing:1px}
  
  .btns{margin-top:25px;display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
  .btn{
    padding:16px 36px;background:#22c55e;color:#0a0f1e;border:none;border-radius:12px;
    font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;
    transition:all 0.3s
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(34,197,94,0.3)}
  .btn-outline{background:transparent;border:2px solid #22c55e;color:#22c55e}
  .btn-outline:hover{background:#22c55e;color:#0a0f1e}
  
  .badge{display:inline-block;background:rgba(34,197,94,0.15);color:#22c55e;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:15px}
  
  @media(max-width:600px){
    h1{font-size:38px}
    .glass{padding:30px 20px}
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="glass">
      <span class="badge">Trusted by 10,000+ Investors</span>
      <h1>Build Your Wealth With SWIFT</h1>
      <p class="sub">Join thousands of Kenyans growing their money. Deposit in seconds via M-Pesa, Card or Bank. Earn up to 5% monthly returns.</p>
      
      <div class="stats">
        <div class="stat">
          <h2>$2.4M+</h2>
          <p>Total Invested</p>
        </div>
        <div class="stat">
          <h2>5%</h2>
          <p>Monthly Returns</p>
        </div>
        <div class="stat">
          <h2>24H</h2>
          <p>Instant Payouts</p>
        </div>
      </div>

      <div class="btns">
        <a href="/register.html" class="btn">Start Investing Now</a>
        <a href="/login.html" class="btn btn-outline">I Have An Account</a>
      </div>
    </div>
  </div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script>
  const auth0 = await createAuth0Client({
    domain: "dev-423epnlkd231fvw0.us.auth0.com",
    client_id: "DAFUBnFPvwSW9MKDwCyu64Nux9VDIT3r"
  });
  if(await auth0.isAuthenticated()) window.location = '/dashboard.html';
</script>
</body>
</html>
