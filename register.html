<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account - SWIFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f1e;color:#fff;font-family:'Segoe UI';display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .box{background:#111827;border:1px solid #1f2937;padding:40px;border-radius:20px;width:100%;max-width:450px}
  h1{color:#22c55e;font-size:28px;margin-bottom:10px;text-align:center}
  .sub{color:#94a3b8;text-align:center;margin-bottom:25px;font-size:14px}
  input{width:100%;padding:14px;margin-top:10px;background:#0a0f1e;border:1px solid #334155;color:#fff;border-radius:10px}
  .btn{width:100%;padding:16px;margin-top:25px;background:#22c55e;color:#0a0f1e;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:0.6;cursor:not-allowed}
  .footer{text-align:center;margin-top:20px;font-size:13px;color:#94a3b8}
  .footer a{color:#22c55e;text-decoration:none}
  .error{color:#ef4444;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>
  <div class="box">
    <h1>Join SWIFT 💰</h1>
    <p class="sub">Create your account and start earning 5% monthly</p>
    
    <form id="register-form">
      <input type="text" id="name" placeholder="Enter your full name" required>
      <input type="email" id="email" placeholder="Enter your email" required>
      <input type="tel" id="phone" placeholder="Enter M-Pesa number" required>
      
      <p class="error" id="error-msg"></p>
      <button type="submit" class="btn" id="submit-btn">Create Account & Start Investing</button>
    </form>

    <p class="footer">Already have an account? <a href="/login.html">Login</a></p>
  </div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script>
let auth0;

async function init() {
  auth0 = await createAuth0Client({
    domain: "dev-423epnlkd231fvw0.us.auth0.com",
    client_id: "DAFUBnFPvwSW9MKDwCyu64Nux9VDIT3r",
    authorizationParams: {
      audience: "https://pesaearn-api"
    }
  });
  
  // If already logged in, skip register
  if(await auth0.isAuthenticated()) {
    window.location = '/dashboard.html';
  }
}
init();

// THE FIX: This actually pushes to Auth0 signup page
document.getElementById('register-form').onsubmit = async (e) => {
  e.preventDefault();
  
  const btn = document.getElementById('submit-btn');
  const error = document.getElementById('error-msg');
  btn.disabled = true;
  btn.innerText = "Redirecting...";
  error.style.display = 'none';

  try {
    await auth0.loginWithRedirect({
      authorizationParams: {
        screen_hint: 'signup', // THIS FORCES SIGNUP MODE
        redirect_uri: window.location.origin + "/onboarding.html" // Where to go after signup
      }
    });
  } catch(err) {
    btn.disabled = false;
    btn.innerText = "Create Account & Start Investing";
    error.innerText = "Failed to connect. Try again.";
    error.style.display = 'block';
    console.log(err);
  }
}
</script>
</body>
</html>
