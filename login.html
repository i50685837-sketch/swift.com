<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - SWIFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f1e;color:#fff;font-family:'Segoe UI';display:flex;justify-content:center;align-items:center;min-height:100vh}
  .box{background:#111827;border:1px solid #1f2937;padding:40px;border-radius:20px;width:90%;max-width:420px}
  h1{color:#22c55e;text-align:center;margin-bottom:10px}
  .sub{color:#94a3b8;text-align:center;margin-bottom:25px;font-size:14px}
  input{width:100%;padding:14px;margin-top:10px;background:#0a0f1e;border:1px solid #334155;color:#fff;border-radius:10px}
  .btn{width:100%;padding:15px;margin-top:20px;background:#22c55e;color:#0a0f1e;border:none;border-radius:10px;font-weight:700;cursor:pointer}
  .btn-google{background:#fff;color:#000;margin-top:10px}
  .footer{text-align:center;margin-top:20px;font-size:13px}
  .footer a{color:#22c55e}
</style>
</head>
<body>
  <div class="box">
    <h1>Login to SWIFT</h1>
    <p class="sub">Access your investment dashboard</p>
    
    <button class="btn" onclick="login()">Login with Email</button>
    <button class="btn btn-google" onclick="googleLogin()">Continue with Google</button>
    
    <p style="text-align:center;margin-top:15px;font-size:12px">
      <a href="#" onclick="forgotPassword()" style="color:#94a3b8">Forgot Password?</a>
    </p>

    <p class="footer">New to SWIFT? <a href="/register.html">Create Account</a></p>
  </div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script>
const auth0 = await createAuth0Client({
  domain: "dev-423epnlkd231fvw0.us.auth0.com",
  client_id: "DAFUBnFPvwSW9MKDwCyu64Nux9VDIT3r"
});

// Auto redirect if already logged in
if(await auth0.isAuthenticated()) window.location = '/dashboard.html';

function login() {
  auth0.loginWithRedirect({
    authorizationParams: { redirect_uri: window.location.origin + "/dashboard.html" }
  });
}

function googleLogin() {
  auth0.loginWithRedirect({
    authorizationParams: { 
      connection: 'google-oauth2',
      redirect_uri: window.location.origin + "/dashboard.html" 
    }
  });
}

function forgotPassword() {
  auth0.loginWithRedirect({
    authorizationParams: { 
      screen_hint: 'reset-password',
      redirect_uri: window.location.origin + "/login.html" 
    }
  });
}
</script>
</body>
</html>
