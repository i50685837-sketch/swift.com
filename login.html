<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - SWIFT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background: #0a0f1e;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
    color:#fff;
    font-family:'Segoe UI',system-ui;
    display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px
  }
  .box{
    background:#111827;
    border:1px solid #1f2937;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:450px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4)
  }
  h1{color:#22c55e;font-size:28px;margin-bottom:10px;text-align:center}
  .sub{color:#94a3b8;text-align:center;margin-bottom:25px;font-size:14px}
  label{font-size:13px;color:#cbd5e1;margin-top:15px;display:block}
  input{
    width:100%;padding:14px;margin-top:6px;background:#0a0f1e;border:1px solid #334155;
    color:#fff;border-radius:10px;font-size:15px
  }
  input:focus{outline:none;border-color:#22c55e}
  .btn{
    width:100%;padding:16px;margin-top:25px;background:#22c55e;color:#0a0f1e;
    border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;transition:0.3s
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(34,197,94,0.3)}
  .btn-google{background:#fff;color:#0a0f1e;display:flex;align-items:center;justify-content:center;gap:10px}
  .divider{display:flex;align-items:center;text-align:center;color:#64748b;margin:20px 0;font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid #334155}
  .divider:not(:empty)::before{margin-right:.5em}
  .divider:not(:empty)::after{margin-left:.5em}
  .footer{text-align:center;margin-top:20px;font-size:13px;color:#94a3b8}
  .footer a{color:#22c55e;text-decoration:none;font-weight:600}
  .forgot{text-align:right;margin-top:8px;font-size:12px}
  .forgot a{color:#94a3b8;text-decoration:none}
  .forgot a:hover{color:#22c55e}
</style>
</head>
<body>
  <div class="box">
    <h1>Welcome Back</h1>
    <p class="sub">Login to access your SWIFT dashboard</p>
    
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>
      
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
      
      <div class="forgot">
        <a href="#" onclick="resetPassword()">Forgot Password?</a>
      </div>

      <button type="submit" class="btn" id="login-btn">Login</button>
    </form>

    <div class="divider">OR</div>
    
    <button class="btn btn-google" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <p class="footer">Don't have an account? <a href="/register.html">Sign Up</a></p>
  </div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script>
let auth0;

async function init() {
  auth0 = await createAuth0Client({
    domain: "dev-423epnlkd231fvw0.us.auth0.com",
    client_id: "DAFUBnFPvwSW9MKDwCyu64Nux9VDIT3r"
  });
  
  // If already logged in, go to dashboard
  if(await auth0.isAuthenticated()) {
    window.location = '/dashboard.html';
  }
}
init();

// EMAIL/PASSWORD LOGIN
document.getElementById('login-form').onsubmit = () => {
  auth0.loginWithRedirect({
    authorizationParams: {
      audience: "https://pesaearn-api",
      redirect_uri: window.location.origin + "/dashboard.html"
    }
  });
}

// GOOGLE LOGIN
function googleLogin() {
  auth0.loginWithRedirect({
    authorizationParams: {
      connection: 'google-oauth2',
      audience: "https://pesaearn-api",
      redirect_uri: window.location.origin + "/dashboard.html"
    }
  });
}

// FORGOT PASSWORD
function resetPassword() {
  auth0.loginWithRedirect({
    authorizationParams: {
      screen_hint: 'reset-password',
      redirect_uri: window.location.origin + "/login.html"
    }
  });
}
</script>
</body>
</html>
